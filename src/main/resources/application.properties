spring.application.name=library

# Oracle Autonomous DB. Credenciales por variables de entorno (no secrets en git).
# DB_URL = jdbc:oracle:thin:@<alias>_tp?TNS_ADMIN=<ruta>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Debe coincidir con jwt.secret de ms-usuarios
jwt.secret=${JWT_SECRET:ForoJwtSecretKey2026DuocFullstackIIIExp1Semana2Segura}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080
